name: Build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --publish never --linux
        if: runner.os == 'Linux'
      - run: npx electron-builder --publish never --win
        if: runner.os == 'Windows'
      - run: npx electron-builder --publish never --mac
        if: runner.os == 'macOS'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/out/*.exe
            dist/out/*.dmg
            dist/out/*.zip
            dist/out/*.AppImage
            dist/out/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
