<html>
    <head>
        <link rel="stylesheet" href="../node_modules/materialize-css/dist/css/materialize.min.css">
        <link rel="stylesheet" href="../assets/material-icons/material-icons.css">
        <style>
            body {
                padding-bottom: 72px;
            }

            #saveBar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                padding: 12px 0;
                background-color: #373737;
            }

            #overlay {
                position: absolute;
                width: 100%;
                height: 100%;
                background-color: black;
                opacity: 0.5;
                z-index: 20;
            }

            #overlay-loader {
                top: 50%;
                left: 50%;
                position: absolute;
                transform: translate(-50%, -50%);
            }

            #overlay-loader > .preloader-wrapper {
                width: 128px;
                height: 128px;
                opacity: 1;
            }
        </style>
    </head>
    <body>
        <div id="overlay">
            <div id="overlay-loader">
                <div class="preloader-wrapper big active">
                    <div class="spinner-layer spinner-blue-only">
                        <div class="circle-clipper left">
                            <div class="circle"></div>
                        </div>
                        <div class="gap-patch">
                            <div class="circle"></div>
                        </div>
                        <div class="circle-clipper right">
                            <div class="circle"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <br/>
        <div class="container">
            <div class="row">
                <form class="col s12">
                    <div class="row">
                        <div class="input-field col s12">
                            <input value="MyCommand" id="name" type="text">
                            <label for="name">Name</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12">
                            <input value="My Command!" id="description" type="text">
                            <label for="description">Description</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12">
                            <input value="/<command>" id="usage" type="text">
                            <label for="usage">Usage</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12">
                            <input value="" id="aliases" type="text">
                            <label for="aliases">Aliases (comma-separated)</label>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div id="saveBar">
            <div class="container">
                <button class="btn" id="saveCommand">Save</button>
            </div>
        </div>

        <script src="../node_modules/materialize-css/dist/js/materialize.min.js"></script>
        <script>require("../out/pages/commandEditor")</script>
    </body>
</html>
