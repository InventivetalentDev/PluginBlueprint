<html>
    <head>
        <link rel="stylesheet" href="../assets/lib/litegraph/litegraph.css">
        <style>
            html, body {
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;

                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;

                overflow: hidden;
            }

            #mycanvas {
                width: 100%;
                height: 100%;
            }

            #toolbar {
                position: absolute;
                top: 0;
                width: 100%;
                box-sizing: border-box;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
                padding: 8px;
                background-color: #222e;
                color: white;
                font-size: 14px;
                z-index: 18;
            }

            #toolbar button, #toolbar input {
                font: inherit;
                color: #d0d0d0;
                background-color: #333;
                border: 1px solid #777;
                border-radius: 3px;
                padding: 6px 10px;
            }

            #toolbar button:enabled:hover {
                background-color: #555;
            }

            #toolbar :focus-visible {
                outline: 2px solid #bde8ff;
                outline-offset: 2px;
            }

            #toolbar button:disabled {
                opacity: 0.5;
            }

            #findBox {
                display: inline-flex;
                align-items: center;
                flex-wrap: wrap;
                gap: 8px;
            }

            #findBox[hidden] {
                display: none;
            }

            #overlay {
                position: absolute;
                width: 100%;
                height: 100%;
                background-color: black;
                opacity: 0.5;
                z-index: 20;
            }

            #overlay-loader {
                top: 50%;
                left: 50%;
                position: absolute;
                transform: translate(-50%, -50%);
            }

            #overlay-loader > .preloader-wrapper {
                width: 128px;
                height: 128px;
                opacity: 1;
            }

            #helpBox {
                position: absolute;
                width: 100%;
                height: 10%;
                background-color: #00000069;
                z-index: 18;
                bottom: 0;
                text-align: center;
                color: white;
                font-family: "Courier New", monospace;
                font-size: 20px;
                padding-top: 5px;
                padding-bottom: 5px;
            }

            #helpBox .helpBox-shortcut {
                height: 80%;
                width: auto;
                display: inline;
                padding-left: 10px;
                padding-right: 10px;
            }

            #helpBox .keypics {
                height: 95%;
                width: auto;
                vertical-align: middle;
            }

            #helpBox .keypics[data-type=key] {
                height: 70%;
            }
        </style>
    </head>
    <body>
        <div id="toolbar" role="toolbar" aria-label="Editor actions">
            <button id="saveGraph" type="button">Save</button>
            <button id="buildReload" type="button">Build &amp; Reload</button>
            <button id="testPlugin" type="button">Test</button>
            <button id="stopServer" type="button" disabled>Stop</button>
            <span id="saveState" role="status">Saved</span>
            <div id="findBox" hidden>
                <label for="findInput">Find</label>
                <input id="findInput" type="text" autocomplete="off" aria-describedby="findCount" title="Enter: next match. Shift+Enter: previous match. Escape: close.">
                <span id="findCount" role="status">0 of 0</span>
            </div>
        </div>
        <div id="overlay">
            <div id="overlay-loader">
                <img src="../assets/images/spinner.svg">
            </div>
        </div>
        <div id="helpBox">
            <div class="helpBox-shortcut">
                <i class="keypics" data-type="mouse" data-color="dark" data-label="x2" data-fontFamily="RobotoMono">left</i>&nbsp;Search / Auto-Link
            </div>
            <div class="helpBox-shortcut">
                <i class="keypics" data-type="mouse" data-color="dark" data-fontFamily="RobotoMono">right</i>&nbsp;Menu
            </div>
            <div class="helpBox-shortcut">
                <i class="keypics" data-type="key" data-color="dark">Ctrl</i>
                +
                <i class="keypics" data-type="mouse" data-color="dark" data-fontFamily="RobotoMono">left</i>&nbsp;Select
            </div>
        </div>
        <canvas id='mycanvas' width='1920' height='1080'></canvas>
        <script>require("../out/pages/graph")</script>
    </body>
</html>
