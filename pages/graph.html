<html>
    <head>
        <link rel="stylesheet" href="../assets/lib/litegraph/litegraph.css">
        <style>
            html, body {
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;

                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;

                overflow: hidden;
            }

            #mycanvas {
                width: 100%;
                height: 100%;
            }

            #overlay {
                position: absolute;
                width: 100%;
                height: 100%;
                background-color: black;
                opacity: 0.5;
                z-index: 20;
            }

            #overlay-loader {
                top: 50%;
                left: 50%;
                position: absolute;
                transform: translate(-50%, -50%);
            }

            #overlay-loader > .preloader-wrapper {
                width: 128px;
                height: 128px;
                opacity: 1;
            }

            #helpBox {
                position: absolute;
                width: 100%;
                height: 10%;
                background-color: #00000069;
                z-index: 18;
                bottom: 0;
                text-align: center;
                color: white;
                font-family: "Courier New", monospace;
                font-size: 20px;
                padding-top: 5px;
                padding-bottom: 5px;
            }

            #helpBox .helpBox-shortcut {
                height: 80%;
                width: auto;
                display: inline;
                padding-left: 10px;
                padding-right: 10px;
            }

            #helpBox .keypics {
                height: 95%;
                width: auto;
                vertical-align: middle;
            }

            #helpBox .keypics[data-type=key] {
                height: 70%;
            }
        </style>
    </head>
    <body>
        <div id="overlay">
            <div id="overlay-loader">
                <img src="../assets/images/spinner.svg">
            </div>
        </div>
        <div id="helpBox">
            <div class="helpBox-shortcut">
                <i class="keypics" data-type="mouse" data-color="dark" data-label="x2" data-fontFamily="RobotoMono">left</i>&nbsp;Search / Auto-Link
            </div>
            <div class="helpBox-shortcut">
                <i class="keypics" data-type="mouse" data-color="dark" data-fontFamily="RobotoMono">right</i>&nbsp;Menu
            </div>
            <div class="helpBox-shortcut">
                <i class="keypics" data-type="key" data-color="dark">Ctrl</i>
                +
                <i class="keypics" data-type="mouse" data-color="dark" data-fontFamily="RobotoMono">left</i>&nbsp;Select
            </div>
        </div>
        <canvas id='mycanvas' width='1920' height='1080'></canvas>
        <script>require("../out/pages/graph")</script>
    </body>
</html>
