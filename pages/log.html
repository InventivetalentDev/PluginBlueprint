<html>
    <head>
        <style>
            .logo {
                display: block;
                margin-left: auto;
                margin-right: auto;
                padding: 2px;
            }

            #log {
                font-family: Consolas, monospace;
                color: white;
                margin-bottom: 30px;
            }

            .entry.err {
                color: red;
            }

            .entry.warn {
                color: orange;
            }

            .entry.has-href {
                cursor: pointer;
                color: #e16700;
            }

            .entry.has-node > .node-ref {
                cursor: pointer;
                color: #00d1f7;
            }

            #cmdInput {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                background: rgba(0, 0, 0, 0.6);
                font-family: Consolas, monospace;
                color: white;
            }
        </style>
    </head>
    <body>
        <div>
            <img class="logo" src="../assets/images/logo-x256.png">
        </div>
        <div id="log">

        </div>
        <input id="cmdInput" type="text" autofocus onblur="this.focus()">
        <script>require("../out/pages/log")</script>
    </body>
</html>
